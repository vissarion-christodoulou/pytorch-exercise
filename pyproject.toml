[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarm-mlp"
version = "0.1.0"
description = "Peer-to-peer pipeline- and data-parallel training of an MLP on MNIST using hivemind."
readme = "README.md"

# Upper bound is hivemind's: its setup.py declares support for 3.9-3.12 only.
requires-python = ">=3.10,<3.13"

# hivemind is deliberately absent from this list. It must be built from the git
# hash the assignment mandates (4d5c414), with --no-build-isolation, which a
# normal dependency resolve cannot do - naming it here would pull an unrelated
# release off PyPI instead. scripts/setup.sh provisions it, and
# requirements.lock.txt pins everything else to the verified versions.
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
swarm-mlp = "swarm_mlp.baseline_reference.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_mlp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests fork real DHT/p2pd processes, so they are opt-in: plain
# `pytest` is fast and hermetic, `pytest -m integration` runs the slow ones
# (a -m on the command line replaces this filter rather than adding to it).
addopts = "-m 'not integration'"
markers = ["integration: starts real DHT/p2pd processes; slow"]
filterwarnings = [
    # hivemind's p2p Client.__del__ touches asyncio during interpreter teardown,
    # long after every DHT and Server has been shut down explicitly. Cosmetic and
    # documented in docs/setup.md; the production entry points suppress it via
    # observability.silence_teardown_noise, which pytest's own hook pre-empts.
    "ignore:Exception ignored in:pytest.PytestUnraisableExceptionWarning",
]
