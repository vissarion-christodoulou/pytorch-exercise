[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytorch-exercise"
version = "0.1.0"
description = "Peer-to-peer pipeline- and data-parallel training of an MLP on MNIST using hivemind."
readme = "README.md"

# Upper bound is hivemind's: its setup.py declares support for 3.9-3.12 only.
requires-python = ">=3.10,<3.13"

# hivemind is deliberately absent from this list. It must be built from the git
# hash the assignment mandates (4d5c414), with --no-build-isolation, which a
# normal dependency resolve cannot do - naming it here would pull an unrelated
# release off PyPI instead. scripts/setup.sh provisions it, and
# requirements.lock.txt pins everything else to the verified versions.
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pytorch-exercise = "pytorch_exercise.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pytorch_exercise"]
